ShortDescription: "Group rows that name the same company, merging only on proof, never guesses"
Description: "reckoner reads a CSV, JSON or JSON Lines file of organization names and groups the rows that are the same company. It merges only on a shared identifier (CIK, UEI, EIN, CAGE, ticker, domain) or an exact normalized name, never a fuzzy guess, refuses merges when registry IDs conflict, and keeps a receipt for every decision."
