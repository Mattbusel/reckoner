name: Release

# Push a tag like v0.2.0 to build single-file executables for Windows, macOS
# and Linux with PyInstaller and attach them to a GitHub Release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Build-only dry run when this workflow itself changes (nothing is released).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  BIN: reckoner
  TAG: ${{ github.event_name == 'pull_request' && 'pr-test' || github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install . "pyinstaller>=6.10"

      - name: Build
        shell: bash
        run: python -m PyInstaller --noconfirm --onefile --console --name "$BIN" --paths . reckoner/__main__.py

      - name: Smoke test the bundled binary
        shell: bash
        run: |
          exe="dist/$BIN"; [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --demo | tee out.txt
          grep -q "7 records -> 4 entities" out.txt
          printf 'Name,CIK\nGENERAL ELECTRIC CO,40545\nGeneral Electric Company,\n' > in.csv
          "$exe" in.csv --format csv | tee out.csv
          grep -q "ent-0,General Electric Company,0.6" out.csv

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="$BIN-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp "dist/$BIN" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "$env:BIN-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "dist/$env:BIN.exe", README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.BIN }}-*.tar.gz
            ${{ env.BIN }}-*.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          version="${TAG#v}"
          # The CHANGELOG section for this version, without its heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "- Windows: \`$BIN-$TAG-windows-x86_64.zip\`"
            echo "- macOS Apple Silicon: \`$BIN-$TAG-macos-arm64.tar.gz\`"
            echo "- macOS Intel: \`$BIN-$TAG-macos-x86_64.tar.gz\`"
            echo "- Linux: \`$BIN-$TAG-linux-x86_64.tar.gz\`"
            echo
            echo "The binaries are unsigned. Windows SmartScreen may say \"unknown publisher\": click More info, then Run anyway. On macOS, if it is blocked, run \`xattr -d com.apple.quarantine reckoner\` or right-click the binary and choose Open the first time. Checksums are in \`SHA256SUMS.txt\`."
          } >> notes.md
          cat notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$BIN $TAG" --notes-file notes.md
          fi
